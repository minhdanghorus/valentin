<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Will you be my Valentine</title>
        <script>
            (function () {
                var theme;
                try { theme = localStorage.getItem('theme'); } catch (e) {}
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            })();
        </script>
        <link rel="stylesheet" href="./styles.css">
        <link rel="icon" href="./favicon.svg" type="image/svg+xml">

    </head>
    <body>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Dark mode" aria-pressed="false"><span id="themeIcon" aria-hidden="true">&#127769;</span></button>
        <button type="button" class="back-to-top" id="backToTop" aria-label="Back to top" hidden><span aria-hidden="true">&#8593;</span></button>
        <script>
            (function () {
                var root = document.documentElement;
                var toggle = document.getElementById('themeToggle');
                var icon = document.getElementById('themeIcon');
                function sync() {
                    var dark = root.getAttribute('data-theme') === 'dark';
                    toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
                    icon.innerHTML = dark ? '&#9728;&#65039;' : '&#127769;';
                }
                toggle.addEventListener('click', function () {
                    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-theme', next);
                    try { localStorage.setItem('theme', next); } catch (e) {}
                    sync();
                });
                sync();
            })();
        </script>
        <script>
            (function () {
                var btn = document.getElementById('backToTop');
                function update() {
                    btn.hidden = window.scrollY <= 300;
                }
                window.addEventListener('scroll', update, { passive: true });
                btn.addEventListener('click', function () {
                    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
                    document.getElementById('top').focus({ preventScroll: true });
                });
                update();
            })();
        </script>
        <div class="container" id="top" tabindex="-1">
            <div>
                <h1 class="header_text">Will you be my Valentine</h1>
                <!-- <h1 class="header_text">Are you free tommorow?</h1> -->
            </div>
            <div class="photo-strip">
                <img src="https://picsum.photos/id/1011/200/200" alt="Sample photo 1 of 3" width="200" height="200" loading="lazy" decoding="async">
                <img src="https://picsum.photos/id/1025/200/200" alt="Sample photo 2 of 3" width="200" height="200" loading="lazy" decoding="async">
                <img src="https://picsum.photos/id/1062/200/200" alt="Sample photo 3 of 3" width="200" height="200" loading="lazy" decoding="async">
            </div>
            <div class="gif_container">
                <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDdtZ2JiZDR0a3lvMWF4OG8yc3p6Ymdvd3g2d245amdveDhyYmx6eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute animated illustration">
            </div>
            <div class="buttons">
                <button type="button" class="btn" id="yesButton" onclick="nextPage()">Yes</button>
                <button type="button" class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">No</button>
                <script>
                    function nextPage() {
                        window.location.href = "yes.html";
                    }

                    function moveButton() {
                        var x = Math.random() * (window.innerWidth - document.getElementById('noButton').offsetWidth) - 100;
                        var y = Math.random() * (window.innerHeight - document.getElementById('noButton').offsetHeight) - 60;
                        document.getElementById('noButton').style.left = `${x}px`;
                        document.getElementById('noButton').style.top = `${y}px`;
                    }
                </script>
            </div>
            <footer class="site-footer">
                <p>&copy; <span id="year">2026</span></p>
                <a href="#top">Back to top</a>
            </footer>
        </div>
        <script>
            document.getElementById('year').textContent = new Date().getFullYear();
        </script>
    </body>
</html>
