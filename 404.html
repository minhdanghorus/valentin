<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>
    <link rel="stylesheet" href="/valentin/yes_style.css" />
    <style>
      .container {
        text-align: center;
      }

      .message {
        color: white;
        font-family: 'Nunito', sans-serif;
        font-size: clamp(16px, 3vw, 24px);
        margin: 16px 0 24px;
      }

      .home_link {
        background-color: #ffffff;
        color: rgb(233, 48, 48);
        padding: 15px 32px;
        display: inline-block;
        font-family: 'Nunito', sans-serif;
        font-size: clamp(18px, 4vw, 32px);
        border-radius: 12px;
        text-decoration: none;
        transition: background-color 0.3s ease;
      }

      .home_link:hover {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="header_text">404 – This page doesn't exist 💔</h1>
      <p class="message">Looks like you took a wrong turn.</p>
      <a class="home_link" href="/valentin/">Back to home</a>
    </div>
  </body>
</html>
